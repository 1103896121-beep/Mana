name: Build and Release iOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_ios:
    name: Build and Archive iOS
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor and Sync iOS
        run: npx cap sync ios

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Install Fastlane
        run: gem install fastlane
        
      - name: Create Fastfile and Debug
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          cd ios/App
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              api_key = app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_content: ENV["APPSTORE_API_PRIVATE_KEY"],
                is_key_content_base64: false,
                in_house: false
              )

              # Fetch provisioning profile
              get_provisioning_profile(api_key: api_key, app_identifier: "com.qingning.mana")

              build_app(
                workspace: "App.xcworkspace",
                scheme: "App",
                export_method: "app-store",
                export_options: "App/ExportOptions.plist",
                xcargs: "CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER='Mana App Store Profile' CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=D86M3VQGR2"
              )

              upload_to_testflight(
                api_key: api_key,
                distribute_external: false
              )
            end
          end
          EOF
          echo "--- Content of generated Fastfile ---"
          cat fastlane/Fastfile

      - name: Install Apple Certificate
        env:
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          cd ios/App
          # Install certificate to a temporary keychain explicitly trusted for codesigning
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode the base64 certificate
          echo -n "$P12_BASE64" | base64 --decode -o $CERT_PATH

          # Create empty keychain
          security create-keychain -p "action" $KEYCHAIN_PATH

          # Set default keychain
          security default-keychain -s $KEYCHAIN_PATH

          # Unlock the keychain
          security unlock-keychain -p "action" $KEYCHAIN_PATH

          # Import certificate to keychain (using the empty password default from Fastlane)
          # Note: Fastlane exported the p12 with an empty password, ignoring the user's placeholder "a"
          security import $CERT_PATH -k $KEYCHAIN_PATH -P "" -T /usr/bin/codesign

          # Enable codesigning partitioning
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "action" $KEYCHAIN_PATH

          echo "--- Verify Identities ---"
          security find-identity -v -p codesigning

      - name: Build and Upload with Fastlane
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          cd ios/App
          fastlane beta

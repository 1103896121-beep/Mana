name: Build and Release iOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_ios:
    name: Build and Archive iOS
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor and Sync iOS
        run: npx cap sync ios

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Install Fastlane
        run: gem install fastlane
        
      - name: Setup Provisioning Profile resolving
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios/App
          mkdir -p fastlane
          # Fastlane requires matching certificates and profiles (Match or Cert/Sigh)
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # Setup API Key
              api_key = app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_content: ENV["APPSTORE_API_PRIVATE_KEY"],
                is_key_content_base64: false,
                in_house: false
              )

              # Automatically manage signing (relies on Xcode's 'Automatically manage signing' being checked)
              # Note: For strict CI, usually certificates are injected, but xcodebuild can attempt automatic signing using the API key.
              
              build_app(
                project: "App.xcodeproj",
                scheme: "App",
                export_method: "app-store"
              )

              # Upload to TestFlight (App Store Connect API)
              upload_to_testflight(
                api_key: api_key,
                distribute_external: false
              )
            end
          end
          EOF

      - name: Build and Upload with Fastlane
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios/App
          fastlane beta

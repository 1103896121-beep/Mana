name: Build and Release iOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_ios:
    name: Build and Archive iOS
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor and Sync iOS
        run: npx cap sync ios

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Install Fastlane
        run: gem install fastlane
        
      - name: Create Fastfile
        run: |
          cd ios/App
          mkdir -p fastlane
          cat << 'FASTFILE_EOF' > fastlane/Fastfile
          require 'spaceship'

          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              api_key = app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_content: ENV["APPSTORE_API_PRIVATE_KEY"],
                is_key_content_base64: false,
                in_house: false
              )

              # Revoke ALL existing Distribution certificates via API
              UI.message("Revoking all existing Distribution certificates...")
              Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key: ENV["APPSTORE_API_PRIVATE_KEY"]
              )
              certs = Spaceship::ConnectAPI::Certificate.all(filter: { certificateType: "DISTRIBUTION" })
              certs += Spaceship::ConnectAPI::Certificate.all(filter: { certificateType: "IOS_DISTRIBUTION" })
              certs.each do |cert|
                UI.message("Revoking certificate: #{cert.id} (#{cert.name})")
                cert.delete!
              end
              UI.success("All Distribution certificates revoked. Creating fresh one...")

              # Generate a brand new distribution certificate (into our custom keychain)
              get_certificates(
                api_key: api_key,
                keychain_path: ENV["KEYCHAIN_PATH"],
                keychain_password: ENV["KEYCHAIN_PASSWORD"]
              )

              # Fetch provisioning profile
              get_provisioning_profile(api_key: api_key, app_identifier: "com.qingning.mana")

              profile_uuid = lane_context[SharedValues::SIGH_UUID]
              profile_name = lane_context[SharedValues::SIGH_NAME]

              # Switch project to manual signing for CI
              update_code_signing_settings(
                use_automatic_signing: false,
                path: "App.xcodeproj",
                team_id: "D86M3VQGR2",
                profile_name: profile_name,
                code_sign_identity: "Apple Distribution"
              )

              # Print versions for debugging
              UI.message("Build Version: #{get_info_plist_value(path: 'App/Info.plist', key: 'CFBundleVersion')}")
              UI.message("Marketing Version: #{get_info_plist_value(path: 'App/Info.plist', key: 'CFBundleShortVersionString')}")

              build_app(
                project: "App.xcodeproj",
                scheme: "App",
                export_method: "app-store",
                xcargs: "CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE='#{profile_uuid}' CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=D86M3VQGR2 CODE_SIGN_KEYCHAIN='#{ENV["KEYCHAIN_PATH"]}'"
              )

              upload_to_testflight(
                api_key: api_key,
                distribute_external: false,
                skip_waiting_for_build_processing: true # Speed up CI
              )
            end
          end
          FASTFILE_EOF
          echo "--- Content of generated Fastfile ---"
          cat fastlane/Fastfile

      - name: Setup Build Keychain
        run: |
          # Create a keychain with a NON-EMPTY password (critical for set-key-partition-list)
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="ci_build_2026"

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add new keychain to search list (KEEP existing keychains too)
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          # Set as default keychain
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "--- Keychain search list ---"
          security list-keychains -d user

          # Export for Fastlane
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "MATCH_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "MATCH_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Build and Upload with Fastlane
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios/App
          fastlane beta

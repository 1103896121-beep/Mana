name: Build and Release iOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build_ios:
    name: Build and Archive iOS
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor and Sync iOS
        run: npx cap sync ios

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/App

      - name: Install Fastlane
        run: gem install fastlane
        
      - name: Create Fastfile
        run: |
          cd ios/App
          mkdir -p fastlane
          cat << 'FASTFILE_EOF' > fastlane/Fastfile
          require 'spaceship'

          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              api_key = app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_content: ENV["APPSTORE_API_PRIVATE_KEY"],
                is_key_content_base64: false,
                in_house: false
              )

              # Revoke ALL existing Distribution certificates via API
              UI.message("Revoking all existing Distribution certificates...")
              Spaceship::ConnectAPI.token = Spaceship::ConnectAPI::Token.create(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key: ENV["APPSTORE_API_PRIVATE_KEY"]
              )
              certs = Spaceship::ConnectAPI::Certificate.all(filter: { certificateType: "DISTRIBUTION" })
              certs += Spaceship::ConnectAPI::Certificate.all(filter: { certificateType: "IOS_DISTRIBUTION" })
              certs.each do |cert|
                UI.message("Revoking certificate: #{cert.id} (#{cert.name})")
                cert.delete!
              end
              UI.success("All Distribution certificates revoked. Creating fresh one...")

              # Generate a brand new distribution certificate
              get_certificates(api_key: api_key)

              # Fetch provisioning profile
              get_provisioning_profile(api_key: api_key, app_identifier: "com.qingning.mana")

              build_app(
                project: "App.xcodeproj",
                scheme: "App",
                export_method: "app-store",
                export_options: "App/ExportOptions.plist",
                xcargs: "CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER='Mana App Store Profile' CODE_SIGN_IDENTITY='Apple Distribution' DEVELOPMENT_TEAM=D86M3VQGR2"
              )

              upload_to_testflight(
                api_key: api_key,
                distribute_external: false
              )
            end
          end
          FASTFILE_EOF
          echo "--- Content of generated Fastfile ---"
          cat fastlane/Fastfile

      - name: Build and Upload with Fastlane
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          cd ios/App
          fastlane beta
